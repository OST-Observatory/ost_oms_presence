<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Observatory Dashboard</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	<script>
		window.APP_CONFIG = { basePath: "{{ base_path or '' }}" };
	</script>
	<script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
	<header class="container header">
		<h1>Observatory Dashboard</h1>
		<div class="status-pill" id="status-pill"><span id="status-text">Loading…</span></div>
	</header>

	<main class="container grid">
		<section class="card card-span cameras" id="cameras">
			<h2>Live cameras</h2>
			<div class="camera-grid">
				<figure class="camera-figure">
					<img id="cam-outdoor" class="camera-img"
						src="{{ media_base }}/outdoor_current.jpg"
						alt="OST outdoor camera" loading="eager" decoding="async">
					<figcaption>Outdoor</figcaption>
				</figure>
				<figure class="camera-figure">
					<img id="cam-indoor" class="camera-img"
						src="{{ media_base }}/indoor_current.jpg"
						alt="OST indoor camera" loading="eager" decoding="async">
					<figcaption>Indoor</figcaption>
				</figure>
			</div>
		</section>

		<section class="card card-span camera-videos">
			<details>
				<summary>Outdoor videos</summary>
				<div class="camera-grid">
					<figure class="camera-figure">
						<video class="camera-video" controls preload="metadata"
							poster="{{ media_base }}/outdoor_current.jpg">
							<source src="{{ media_base }}/outdoor_video.webm" type="video/webm">
						</video>
						<figcaption>Today</figcaption>
					</figure>
					<figure class="camera-figure">
						<video class="camera-video" controls preload="metadata"
							poster="{{ media_base }}/outdoor_current.jpg">
							<source src="{{ media_base }}/yesterday_outdoor_video.webm" type="video/webm">
						</video>
						<figcaption>Yesterday</figcaption>
					</figure>
				</div>
			</details>
		</section>

		<section class="card">
			<h2>Current Session</h2>
			<div class="kv">
				<div>User</div><div id="sess-user">—</div>
				<div>Start</div><div id="sess-start">—</div>
				<div>Target / Note</div><div id="sess-target">—</div>
				<div>Planned end</div><div id="sess-planned">—</div>
				<div>Last heartbeat</div><div id="sess-hb">—</div>
			</div>
			<!-- <p class="hint">(The client starts sessions automatically.)</p> -->
		</section>

		<section class="card">
			<h2>Host Status</h2>
			<ul id="hosts-list" class="hosts"></ul>
			<p id="hosts-empty" class="muted">No host status available.</p>
		</section>

		<section class="card card-span">
			<h2>Observed Region</h2>
			<ul id="tel-list" class="hosts"></ul>
			<p id="tel-empty" class="muted">No telescope status available.</p>
		</section>
	</main>

	<footer class="container footer">
		<span id="last-refresh" class="muted">Last refresh: —</span>
	</footer>
</body>
</html>
