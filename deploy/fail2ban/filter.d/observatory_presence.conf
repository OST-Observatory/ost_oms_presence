[Definition]
# Agent POSTs with a wrong/missing bearer token, and failed dashboard logins.
# The app answers a failed login with 401 and a lockout with 429, so both are
# visible in the Apache access log.
failregex = ^<HOST> .* "POST /ost_status/(start|heartbeat|release|host_status|telescope_status) HTTP/[^"]+" 401
            ^<HOST> .* "POST /ost_status/login HTTP/[^"]+" (401|429)
ignoreregex =
