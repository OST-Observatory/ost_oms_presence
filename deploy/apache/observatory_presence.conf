# Apache vhost (HTTPS) reverse proxy to Gunicorn over UNIX socket
# Requires Apache 2.4.39+ and mod_proxy, mod_headers, mod_ssl
#
# Access model:
#   GET/HEAD (browsers): campus / VPN prefixes, then the app's LDAP login
#   POST (agents):       observatory host(s) only (Bearer token is still required by the app)
#   Public exceptions:   GET/HEAD /ost_status/datenschutz (camera privacy notice, QR code)
#                        GET/HEAD /ost_status/privacy (dashboard privacy notice)
#                        plus /ost_status/static/css and /ost_status/static/fonts
#
# The dashboard login lives in the application (LDAP, session cookie), NOT in
# Apache. Do not add Basic Auth on top -- users would be asked twice.
#
# Replace the RFC 5737 documentation addresses below with your real prefixes/hosts.

<VirtualHost *:443>
    ServerName observatory.example.org

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/observatory.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/observatory.example.org/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # ------------------------------------------------------------------
    # /ost_status
    # Browser access restricted to campus / VPN (the app adds the LDAP login)
    # ------------------------------------------------------------------

    # Serve static assets directly via Apache.
    # CSS/fonts are world-readable so the public privacy page can load them.
    # JS remains campus / VPN only via the <Directory> block below.
    Alias /ost_status/static /mnt/data/observatory_presence/static

    <Directory /mnt/data/observatory_presence/static>
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /mnt/data/observatory_presence/static/js>
        Options -Indexes

        <RequireAny>
                # Campus / VPN prefixes (replace)
                Require ip 192.0.2.0/24
                Require ip 198.51.100.0/24
                Require ip 203.0.113.0/24
        </RequireAny>
    </Directory>

    # Do not proxy static requests (must be before the generic ProxyPass)
    ProxyPass /ost_status/static !

    # Webcam stills and videos (uploaded from the observatory; not in git)
    Alias /ost_status/media/cameras /var/lib/observatory_cameras

    <Directory /var/lib/observatory_cameras>
        Options -Indexes

        <RequireAny>
                # Campus / VPN prefixes (replace; keep in sync with JS Directory and Location)
                Require ip 192.0.2.0/24
                Require ip 198.51.100.0/24
                Require ip 203.0.113.0/24
        </RequireAny>

        <FilesMatch "\.(?i:jpg|jpeg)$">
                Header set Cache-Control "no-cache"
        </FilesMatch>

        <FilesMatch "\.(?i:webm)$">
                Header set Cache-Control "max-age=3600"
        </FilesMatch>
    </Directory>

    ProxyPass /ost_status/media !

    # ------------------------------------------------------------------
    # Browser access
    #
    # GET/HEAD:
    #   - must originate from campus / VPN (this block)
    #   - then the application requires an LDAP login (session cookie)
    #
    # POST:
    #   - only the observatory status client host(s)
    #
    # ---- Opening the dashboard to the public internet -----------------
    # To reach the dashboard from outside campus / VPN, delete the
    # <Limit GET HEAD> block below; the LDAP login then carries the access
    # control on its own. Do the same for the two <Directory> blocks above
    # (static/js and the camera media directory), otherwise the page loads
    # but stays blank and the webcams 403.
    # Leave <Limit POST> untouched -- the agents must stay IP-restricted.
    # Before doing so, set in observatory_presence.env:
    #   LDAP_ALLOWED_GROUP_DNS=<the groups that may log in>
    #   TRUST_PROXY_HEADERS=1   (so rate limiting sees the real client IP)
    # and make sure fail2ban is active.
    # ------------------------------------------------------------------

    <Location /ost_status>
        <Limit GET HEAD>
                <RequireAny>
                        # Campus / VPN prefixes (replace)
                        Require ip 192.0.2.0/24
                        Require ip 198.51.100.0/24
                        Require ip 203.0.113.0/24
                </RequireAny>
        </Limit>

        <Limit POST>
                # Observatory host that POSTs start/heartbeat/release/status (replace)
                Require ip 192.0.2.10
        </Limit>
    </Location>

    # The login form POSTs from a browser, so it must not fall under the
    # agent-only <Limit POST> above. Same campus / VPN rule as GET/HEAD.
    <Location /ost_status/login>
        <RequireAny>
                # Campus / VPN prefixes (replace; delete this block when
                # opening the dashboard to the public internet)
                Require ip 192.0.2.0/24
                Require ip 198.51.100.0/24
                Require ip 203.0.113.0/24
        </RequireAny>
    </Location>

    <Location /ost_status/logout>
        <RequireAny>
                Require ip 192.0.2.0/24
                Require ip 198.51.100.0/24
                Require ip 203.0.113.0/24
        </RequireAny>
    </Location>

    # Public camera privacy notice (QR code / posted information sheet).
    # Must be more specific than <Location /ost_status>.
    <LocationMatch "^/ost_status/datenschutz/?$">
        <Limit GET HEAD>
                Require all granted
        </Limit>
        <LimitExcept GET HEAD>
                Require all denied
        </LimitExcept>
    </LocationMatch>

    # Privacy notice for the dashboard itself. Public because it has to be
    # readable before signing in, and it must stay reachable if the campus /
    # VPN restriction above is ever removed.
    <LocationMatch "^/ost_status/privacy/?$">
        <Limit GET HEAD>
                Require all granted
        </Limit>
        <LimitExcept GET HEAD>
                Require all denied
        </LimitExcept>
    </LocationMatch>

    <Location /ost_status/static/css>
        Require all granted
    </Location>

    <Location /ost_status/static/fonts>
        Require all granted
    </Location>

    # Optional: exempt /ost_status/health for uptime monitors
    # (still subject to campus / VPN allowlisting unless you add a separate Location)
    # <Location /ost_status/health>
    #     <Limit GET>
    #         Require ip 192.0.2.0/24
    #     </Limit>
    # </Location>

    # ------------------------------------------------------------------
    # Proxy to Gunicorn over UNIX socket (HTTP protocol)
    #
    # IMPORTANT: the hostname after the "|" is a dummy. It is never resolved
    # (the connection goes to the socket), but mod_proxy uses it as the key
    # that identifies the reverse proxy worker. If another vhost/app on the
    # same server also proxies to a UNIX socket via "http://localhost/",
    # both definitions collide on one worker and whichever is declared first
    # wins -- requests then silently reach the wrong backend.
    #
    # Use a unique, clearly-fake hostname per socket-backed app.
    # ------------------------------------------------------------------

    ProxyPass        /ost_status unix:/run/observatory_presence/gunicorn.sock|http://ost-status.invalid/
    ProxyPassReverse /ost_status http://ost-status.invalid/

    # ------------------------------------------------------------------
    # Read-only endpoint
    # ------------------------------------------------------------------

    <Location /ost_status/status>
        <LimitExcept GET>
                Require all denied
        </LimitExcept>
    </Location>
</VirtualHost>

# Optional HTTP to HTTPS redirect
# <VirtualHost *:80>
#   ServerName observatory.example.org
#   RewriteEngine On
#   RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
# </VirtualHost>
