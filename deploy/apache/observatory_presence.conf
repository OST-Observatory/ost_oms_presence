# Apache vhost (HTTPS) reverse proxy to Gunicorn over UNIX socket
# Requires Apache 2.4.39+ and mod_proxy, mod_headers, mod_ssl enabled

<VirtualHost *:443>
    ServerName observatory.example.org

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/observatory.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/observatory.example.org/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Serve static assets directly via Apache
    Alias /ost_status/static /mnt/data/observatory_presence/static
    <Directory /mnt/data/observatory_presence/static>
        Require all granted
        Options -Indexes
    </Directory>

    # Do not proxy static requests (must be before the generic ProxyPass)
    ProxyPass        /ost_status/static !

    # Webcam stills and videos (uploaded from the observatory; not in git)
    Alias /ost_status/media/cameras /var/lib/observatory_cameras
    <Directory /var/lib/observatory_cameras>
        Require all granted
        Options -Indexes
        <FilesMatch "\.(?i:jpg|jpeg)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <FilesMatch "\.(?i:webm)$">
            Header set Cache-Control "max-age=3600"
        </FilesMatch>
    </Directory>
    ProxyPass        /ost_status/media !

    # Optional: exempt /ost_status/health from .htaccess Basic Auth for uptime monitors
    # <Location /ost_status/health>
    #     Require all granted
    #     Satisfy Any
    # </Location>

    # Proxy to Gunicorn over UNIX socket (HTTP) for the rest of the app
    ProxyPass        /ost_status unix:/run/observatory_presence/gunicorn.sock|http://localhost/
    ProxyPassReverse /ost_status http://localhost/

    # Optional: tighten read-only endpoints
    <Location /ost_status/status>
        <LimitExcept GET>
            Require all denied
        </LimitExcept>
    </Location>
</VirtualHost>

